services:
  postgres:
    image: postgres:16
    container_name: private-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-privateai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-privateai_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-privateai}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-privateai} -d ${POSTGRES_DB:-privateai}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: private-ai-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    # Pinned to the version this project was developed against; `latest` made
    # the stack non-reproducible.
    image: qdrant/qdrant:v1.19.1
    container_name: private-ai-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    # No healthcheck: the Qdrant image ships without curl, wget or nc, so there
    # is no in-container way to probe the HTTP API. The backend reports Qdrant
    # status through GET /health instead.

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: private-ai-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-privateai}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-privateai_dev_password}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      # AMQP and the management UI are both bound to the loopback interface
      # only; the broker is never reachable from outside this machine.
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

# The MLX/Gemma inference service is intentionally NOT containerised: it needs
# native Apple Silicon Metal access and runs on the host at 127.0.0.1:8001.

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  rabbitmq_data:
